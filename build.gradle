ext.kotlin_version = '1.9.25'
ext.serialization_version = '1.0.0'
ext.jmh_version = '1.37'

buildscript {
    ext.kotlin_version = '1.9.25'
    ext.serialization_version = '1.0.0'
    ext.jmh_version = '1.37'
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.9.1"
        classpath "me.champeau.jmh:me.champeau.jmh.gradle.plugin:0.7.3"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin.plugin.serialization:org.jetbrains.kotlin.plugin.serialization.gradle.plugin:$kotlin_version"
        classpath "com.gradleup.shadow:shadow-gradle-plugin:8.3.6"
        classpath "androidx.benchmark:benchmark-gradle-plugin:1.3.4"
        classpath 'androidx.benchmark:benchmark-baseline-profile-gradle-plugin:1.3.4'
    }
}

subprojects {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
