import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

apply plugin: 'java-library'
apply plugin: 'org.jetbrains.kotlin.jvm'
apply plugin: 'org.jetbrains.kotlin.kapt'
apply plugin: 'kotlinx-serialization'

java {
    toolchain.setLanguageVersion(JavaLanguageVersion.of(11))
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

tasks.withType(KotlinCompile).configureEach {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_11
    }
}

dependencies {
    kapt 'com.google.auto.value:auto-value-annotations:1.11.0'
    kapt 'com.google.auto.value:auto-value:1.11.0'
    kapt 'com.ryanharter.auto.value:auto-value-gson:1.3.1'
    kapt 'com.ryanharter.auto.value:auto-value-moshi:0.4.7'
    kapt 'com.squareup.moshi:moshi-kotlin-codegen:1.15.2'

    compileOnly 'com.google.auto.value:auto-value-annotations:1.11.0'
    compileOnly 'com.ryanharter.auto.value:auto-value-moshi-annotations:1.0.0'

    implementation 'com.ryanharter.auto.value:auto-value-gson-runtime:1.3.1'
    implementation 'com.google.auto.value:auto-value-annotations:1.11.0'
    api 'com.google.guava:guava:33.4.8-jre'
    api 'com.squareup.moshi:moshi-kotlin:1.15.2'
    api 'com.squareup.okio:okio:3.7.0'
    api 'com.squareup.moshi:moshi:1.15.2'
    api 'com.squareup.moshi:moshi-adapters:1.15.2'
    api 'com.google.code.gson:gson:2.13.0'
    api "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
    api "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    api "org.jetbrains.kotlinx:kotlinx-serialization-json:$serialization_version"
}
