import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
    id 'java-library'
    id 'com.google.devtools.ksp' version '2.1.20-1.0.32'
    id 'org.jetbrains.kotlin.jvm'
    id 'kotlinx-serialization'
}

java {
    toolchain.setLanguageVersion(JavaLanguageVersion.of(21))
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(KotlinCompile).configureEach {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_21
    }
}

dependencies {
    ksp 'com.squareup.moshi:moshi-kotlin-codegen:1.15.2'
    annotationProcessor"com.ryanharter.auto.value:auto-value-moshi-extension:1.1.0"
    implementation "com.ryanharter.auto.value:auto-value-moshi-runtime:1.1.0"
    annotationProcessor "com.ryanharter.auto.value:auto-value-moshi-factory:1.1.0"

    annotationProcessor "com.google.auto.value:auto-value:1.11.0"
    annotationProcessor "com.ryanharter.auto.value:auto-value-gson-extension:1.3.1"
    implementation "com.ryanharter.auto.value:auto-value-gson-runtime:1.3.1"
    annotationProcessor "com.ryanharter.auto.value:auto-value-gson-factory:1.3.1"
    annotationProcessor "com.ryanharter.auto.value:auto-value-gson:1.3.1"
    implementation 'com.google.auto.value:auto-value-annotations:1.11.0'

    api 'com.google.guava:guava:33.4.8-jre'
    api 'com.squareup.moshi:moshi-kotlin:1.15.2'
    api 'com.squareup.okio:okio:3.7.0'
    api 'com.squareup.moshi:moshi:1.15.2'
    api 'com.squareup.moshi:moshi-adapters:1.15.2'
    api 'com.google.code.gson:gson:2.13.0'
    api "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
    api "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    api "org.jetbrains.kotlinx:kotlinx-serialization-json:$serialization_version"
}
